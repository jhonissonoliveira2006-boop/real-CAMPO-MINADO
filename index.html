const PG_=[
["Objetivo","Atravesse o campo até a SAÍDA, no canto superior direito (a seta amarela mostra o caminho), antes do tempo acabar. Arraste na tela como um joystick. Os números no chão contam as minas nas 8 casas vizinhas. Pisar numa mina é fim de jogo."],
["Soldados","Cada soldado tem um olho acima da cabeça. Branco: calmo, a pupila mostra para onde ele olha. Amarelo: te perdeu e está procurando. Vermelho com veias: te viu e vai atirar. A barra de Exposição sobe enquanto você é visto, e cada tiro disparado contra você soma mais 5%. Soldados que te veem ficam parados atirando e param para recarregar. Cinza-azulado e piscando tonto: atordoado pela bomba de luz."],
["Torres de vigia","Torres projetam um foco de luz que varre o campo e CAÇA você quando te vê: ele segue seus passos e, se te perder, vai até o último lugar onde te viu. Perto da torre ele é redondo, longe fica alongado e mais fraco, até sumir. Torres VERMELHAS são armadas: se a luz te alcançar, elas atiram, a menos que você esteja em cobertura (a luz ainda te marca e enche a barra de Exposição). Torres ALIADAS (marrons) só te iluminam por 1 s e voltam a patrulhar. Fique fora da luz, esconda-se ou agache-se. Uma explosão perto do pé da torre a derruba e ela pega fogo, matando quem estiver em cima. Ou derrube o soldado de uma torre vermelha (seus aliados também atiram nele) e fique 2 s na plataforma para tomá-la: ela passa a atirar nos inimigos e quem domina a torre tem +30% de vantagem."],
["Esconderijos","Agachado, você some da vista encostado em paredes, elevações, arbustos, trincheiras ou na poeira. Cercas de arame não escondem. Agachado numa trincheira você fica imune a tiros. Ruínas de casas (madeira, tijolo, concreto) escondem da vista, mas podem ter 1 ou 2 minas. Há dois níveis escaláveis; você também pode descer caminhando, e os soldados sobem e descem pelo terreno."],
["Radar","O radar usa pilhas: cada pilha dá 5 scans (você começa com uma carregada; o painel ⚡ mostra a carga e as reservas). Ache mais pilhas pelo mapa. O aparelho no canto inferior direito da tela (toque na aba dele para guardar ou puxar) mostra a grade ao seu redor, com relevo e obstáculos. Aperte SCAN para detectar minas: elas aparecem só no aparelho, como pontos vermelhos piscando que somem com o tempo. Recarga de 20 s, mostrada pela barrinha na aba."],
["Floresta: armadilhas de urso","Na floresta, as minas dão lugar a armadilhas de urso (30% mais). Os números continuam indicando quantas há ao redor, e aparecem nítidos, sem folhas por cima. Toque em RASTREAR, acima do personagem, para estender um galho duas casas à frente: ele fica estendido e acompanha você enquanto anda, até se partir numa armadilha, que dispara longe de você, salta e atinge todas as casas ao redor dela. Toque em GUARDAR GALHO para recolhê-lo sem gastar."],
["Pedras, galhos e pilhas","Pegue pedras, galhos e pilhas pelo chão. Toque em Arremessar e arraste (as pedras saem primeiro; segure o botão para escolher pilha ou outros itens), arrastando para o lado oposto, como um estilingue. O objeto ativa a mina em que cair e atrai soldados próximos com o barulho. Uma pedra que acerta um soldado o derruba e o atordoa por 5 s. Pilha arremessada se perde."],
["Relevos","Montes de terra (marrons) atravessam os caminhos: pule por cima deles, e eles também bloqueiam a visão dos soldados. Degraus baixos de terra, de borda irregular e rachada, dá para alcançar pulando; paredões de pedra de borda reta e firme só se escalam. Há dois níveis escaláveis, e descer para terrenos mais baixos é automático. Ao lado dos montes há baixadas escuras: agache dentro de uma baixada para se esconder quando for visto.",],
["Esconderijos","Moitas, banheiros químicos (azuis) e montes de feno (dourados) escondem você. Entre neles e fique quieto: nas moitas, agache ou pare. Soldados que procuram por perto podem te descobrir se você demorar muito.",],
["Nocaute e missões","Você é uma criança refugiada, sem armas. Chegando por trás de um soldado que não te viu, aparece na tela um arraste: siga o caminho até o fim e ele desmaia. Errar alerta o soldado. Aliados (setas brancas no radar) conversam com você e mandam levar uma encomenda a outro aliado. Perto deles os inimigos não entram."],
["Correr e pular","Puxe o joystick até o limite do círculo para correr (no teclado, segure Shift). Agachado você não corre. Para pular, arraste o botão ↑ na direção desejada: quanto mais longe arrastar, mais longe o pulo (até uns 3 blocos), sem travar em quadrados. A mira mostra onde você pousa: verde dá certo, laranja é paredão que dá para subir, vermelho é parede e você só bate e para. Dá para pular arames, troncos, montes e degraus baixos; para escalar, segure ↑ parado perto de um paredão que não dá para alcançar pulando. Dá para pular contra qualquer paredão e, ao pousar colado nele, segurar ↑ sem arrastar: é o pulo seguido de escalada, 20% mais rápido. Do alto de um patamar dá para saltar até outro, mesmo com penhasco no meio. Descer ou subir andando leva um instante para confirmar; arrastando o ↑ você salta na hora. Ao saltar de um lugar alto para o chão, você cai rolando 1 bloco para a frente. As veias de trincheira são cercadas de arame: pule por cima para entrar e agache lá dentro para se esconder."],
["Floresta: cordões","Cordões esticados entre dois postes (sempre visíveis) escondem armadilhas de guerra: poço com estacas de 4 casas que desaba logo à frente, viga giratória de estacas, tronco pendular e granada presa ao arame. Passar pelo cordão ativa; pular por cima não ativa. Soldados também podem acionar."],
["Água, fogo e corpos","Poças e rios deixam você (e os soldados) mais lentos. Nas florestas, a água tem crocodilos: só os olhos aparecem, eles nadam até quem está na água e abocanham na hora. Soldados têm 20% de chance de matar o bicho a tiros; luz e pedras atordoam. Perto do fogo a Exposição sobe e, se encher, você cai em chamas. Áreas em chamas queimam: não fique parado no fogo (o chão carbonizado ao redor é seguro e os soldados evitam as chamas). Aliados que andam pelo mapa trocam tiros com soldados inimigos atrás de escombros, prendendo o inimigo ali; a cada troca há 15% de chance de o aliado cair e 20% de chance de o inimigo cair. Os inimigos caídos podem ter armas e pentes para você revistar."],
["Nevada: congelamento","Na neve há uma segunda barra, azul: Congelamento. Ela enche sozinha com o frio e, se chegar ao fim, você congela. Para esvaziá-la, fique perto das fogueiras: o calor chega a uns 5 quadrados e é mais forte quanto mais perto. Mas dentro do círculo tracejado, o calor intenso, a Exposição sobe (e, se encher, você cai em chamas). Fique entre o tracejado e a borda do brilho laranja: ali você esquenta sem subir a Exposição."],
["Dica","Os soldados conhecem o campo e raramente pisam em minas, mas na perseguição isso fica mais comum. Use isso a seu favor."]];
